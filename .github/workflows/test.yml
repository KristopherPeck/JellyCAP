name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore .\tests\Jellyfin.Plugin.JellyCAP.Tests\Jellyfin.Plugin.JellyCAP.Tests.csproj

      - name: Run tests
        run: dotnet test --project .\tests\Jellyfin.Plugin.JellyCAP.Tests\Jellyfin.Plugin.JellyCAP.Tests.csproj --configuration Release --no-restore
