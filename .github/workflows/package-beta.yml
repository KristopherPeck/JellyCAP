name: Package beta candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part version matching the project and manifest
        required: true
        default: 0.4.0.0
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build and package candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload candidate for workstation testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JellyCAP_${{ inputs.version }}
          path: |
            artifacts/JellyCAP_${{ inputs.version }}.zip
            artifacts/JellyCAP_${{ inputs.version }}.md5.txt
            artifacts/JellyCAP_${{ inputs.version }}.sha256.txt
          if-no-files-found: error
