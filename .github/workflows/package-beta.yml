name: Package beta candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part version matching the project and manifest
        required: true
        default: 0.1.0.0
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and package candidate
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version '${{ inputs.version }}'

      - name: Upload candidate for workstation testing
        uses: actions/upload-artifact@v7
        with:
          name: JellyCAP_${{ inputs.version }}
          path: |
            artifacts/JellyCAP_${{ inputs.version }}.zip
            artifacts/JellyCAP_${{ inputs.version }}.md5.txt
          if-no-files-found: error
